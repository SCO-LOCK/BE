name: SCOLOCK-halfthon CI/CD

on:
  pull_request:
    branches:
      - halfthon

  push:
    branches:
      - halfthon

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar -x test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/halfthon'

    steps:
      - name: Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"