spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/scolock_db?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
