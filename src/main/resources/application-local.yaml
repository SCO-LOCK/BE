spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/scolock_db?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8"
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
