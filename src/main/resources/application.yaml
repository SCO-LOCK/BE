spring:
  application:
    name: BE_SCOLOCK
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      encoding: UTF-8
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
  profiles:
    default: local

server:
  port: 8081

app:
  analysis:
    timeout: ${AI_ANALYSIS_TIMEOUT:60s}
